    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name metricas.daosrl.com.ar;

    ssl_certificate     /etc/letsencrypt/live/metricas.daosrl.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricas.daosrl.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Max file upload size (for Excel files)
    client_max_body_size 50M;

    location / {
        proxy_pass http://172.20.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
