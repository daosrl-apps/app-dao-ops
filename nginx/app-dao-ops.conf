# Configuración de Nginx para app-dao-ops
# Ubicación en el VPS: /opt/docker/eventosips/nginx/conf.d/app-dao-ops.conf
# Después de actualizar: docker exec eventosips-nginx-1 nginx -s reload

upstream app_dao_ops_upstream {
    # Service "web" del compose de app-dao-ops, expuesto en la red docker web-proxy.
    server app-dao-ops-web-1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dao-ops.daosrl.com.ar;

    # ACME / certbot webroot challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dao-ops.daosrl.com.ar;

    ssl_certificate     /etc/letsencrypt/live/dao-ops.daosrl.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dao-ops.daosrl.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    client_max_body_size 10m;

    location = /api/health {
        proxy_pass http://app_dao_ops_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://app_dao_ops_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
