# Configuración de producción para app-dao-ops
services:
  db:
    ports: !reset []
    restart: always

  web:
    ports:
      - "8081:3000"
    restart: always
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:alpine-slim
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/app-dao-ops.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web

