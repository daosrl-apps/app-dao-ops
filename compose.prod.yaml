# Overlay producción — el nginx compartido de `eventosips` termina TLS y
# proxea *.beyondit.ar a los backends de la red externa `web-proxy`.
services:
  db:
    ports: !reset []
    restart: always

  web:
    ports: !reset []
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - default
      - web-proxy

networks:
  web-proxy:
    external: true
