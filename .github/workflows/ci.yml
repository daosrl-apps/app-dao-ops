name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # El package-lock.json se genera con npm 11 (estilo lockfileVersion 3 con
      # las deps opcionales de esbuild que trae vitest). npm 10 interpreta esas
      # optional deps distinto y `npm ci` falla con "Missing ... from lock file".
      # Fijamos npm 11 para que coincida con el generador del lockfile.
      - name: Pin npm 11
        run: npm install -g npm@11

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          # Placeholders — la validación Zod necesita las vars seteadas.
          NODE_ENV: production
          APP_URL: http://placeholder.local
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: build_phase_placeholder_at_least_32_characters_long_dummy
        run: npm run build
